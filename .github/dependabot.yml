
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"

    open-pull-requests-limit: 10

    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
